<svg viewBox="0 0 800 1040" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e6e6e6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="1040" rx="20" fill="#111111"/>

  <g fill="none" stroke="#aaaaaa" stroke-width="1.5">
    <!-- uploaded file -> dispatch -> extracted text -->
    <line x1="320" y1="76" x2="320" y2="128" marker-end="url(#arrow)"/>

    <!-- text branch -->
    <line x1="320" y1="158" x2="320" y2="195" marker-end="url(#arrow)"/>
    <line x1="320" y1="218" x2="320" y2="245" marker-end="url(#arrow)"/>
    <line x1="320" y1="273" x2="320" y2="300"/>
    <line x1="130" y1="300" x2="600" y2="300"/>
    <line x1="130" y1="300" x2="130" y2="314" marker-end="url(#arrow)"/>
    <line x1="320" y1="300" x2="320" y2="314" marker-end="url(#arrow)"/>
    <line x1="600" y1="300" x2="600" y2="314" marker-end="url(#arrow)"/>

    <!-- graph extraction -> knowledge graph -->
    <line x1="600" y1="357" x2="600" y2="387" marker-end="url(#arrow)"/>

    <!-- index -> query phase divider -->
    <line x1="60" y1="460" x2="740" y2="460" stroke-dasharray="4 4"/>

    <!-- knowledge graph reused at query time -->
    <line x1="600" y1="432" x2="600" y2="578" stroke-dasharray="2 6"/>

    <!-- user question -> normalize -> split bm25 / vintern / graph -->
    <line x1="343" y1="538" x2="343" y2="548"/>
    <line x1="130" y1="548" x2="600" y2="548"/>
    <line x1="130" y1="548" x2="130" y2="572" marker-end="url(#arrow)"/>
    <line x1="320" y1="548" x2="320" y2="572" marker-end="url(#arrow)"/>
    <line x1="600" y1="548" x2="600" y2="572" marker-end="url(#arrow)"/>

    <!-- bm25/vintern/graph merge -> RRF ; graph column continues on to Graph Facts (T-junction) -->
    <line x1="130" y1="598" x2="130" y2="635" stroke-dasharray="3 3"/>
    <line x1="320" y1="598" x2="320" y2="635" stroke-dasharray="3 3"/>
    <line x1="600" y1="617" x2="600" y2="763" stroke-dasharray="3 3"/>
    <line x1="130" y1="635" x2="600" y2="635" stroke-dasharray="3 3"/>
    <line x1="343" y1="635" x2="343" y2="647" marker-end="url(#arrow)"/>

    <!-- RRF -> rerank -> top-n chunks -->
    <line x1="343" y1="670" x2="343" y2="697" marker-end="url(#arrow)"/>
    <line x1="343" y1="723" x2="343" y2="758" marker-end="url(#arrow)"/>

    <!-- top chunks + graph facts -> merge -> reader -->
    <line x1="343" y1="790" x2="343" y2="825" stroke-dasharray="3 3"/>
    <line x1="600" y1="800" x2="600" y2="825" stroke-dasharray="3 3"/>
    <line x1="343" y1="825" x2="600" y2="825" stroke-dasharray="3 3"/>
    <line x1="472" y1="825" x2="472" y2="834" marker-end="url(#arrow)"/>

    <!-- reader -> answer -> triad -->
    <line x1="472" y1="879" x2="472" y2="889" marker-end="url(#arrow)"/>
    <line x1="472" y1="913" x2="472" y2="940" marker-end="url(#arrow)"/>
  </g>

  <g fill="#f2f2f2">
    <text x="320" y="40" text-anchor="middle">[ Uploaded File ]</text>
    <text x="320" y="63" text-anchor="middle" fill="#9aa" font-size="12">(dispatch: pdf / docx / html / txt)</text>

    <text x="320" y="150" text-anchor="middle">[ Extracted Text ]</text>

    <text x="320" y="210" text-anchor="middle">[ NFC Normalize ]</text>
    <text x="320" y="265" text-anchor="middle">[ Chunk Text ]</text>

    <text x="130" y="332" text-anchor="middle">[ BM25L Index ]</text>
    <text x="130" y="349" text-anchor="middle" fill="#9aa" font-size="12">(pyvi word-seg)</text>

    <text x="320" y="332" text-anchor="middle">[ Vintern-Embedding-1B ]</text>
    <text x="320" y="349" text-anchor="middle" fill="#9aa" font-size="12">(dense text, 1 vector per chunk)</text>

    <text x="600" y="332" text-anchor="middle">[ Graph Triple Extraction ]</text>
    <text x="600" y="349" text-anchor="middle" fill="#ffcf6b" font-size="12">(optional, off by default)</text>


    <text x="600" y="405" text-anchor="middle">[ Knowledge Graph ]</text>
    <text x="600" y="422" text-anchor="middle" fill="#9aa" font-size="12">(in-memory, NetworkX)</text>

    <text x="60" y="450" fill="#9aa" font-size="13">QUERY PHASE</text>

    <text x="343" y="500" text-anchor="middle">User Question</text>
    <text x="343" y="530" text-anchor="middle" fill="#ffcf6b" font-size="12">(NFC normalize)</text>

    <text x="130" y="590" text-anchor="middle">[ BM25L Search ]</text>
    <text x="320" y="590" text-anchor="middle">[ Vintern Dense Search ]</text>
    <text x="600" y="590" text-anchor="middle">[ Graph: Match Entities + Traverse ]</text>
    <text x="600" y="607" text-anchor="middle" fill="#9aa" font-size="12">(GRAPH_HOPS, default 1)</text>

    <text x="343" y="662" text-anchor="middle">[ Reciprocal Rank Fusion (RRF) ]</text>

    <text x="343" y="715" text-anchor="middle">[ PhoRanker Cross-Encoder Rerank (local) ]</text>

    <text x="343" y="775" text-anchor="middle">Top-N Chunks</text>
    <text x="600" y="775" text-anchor="middle">[ Graph Facts Lookup ]</text>
    <text x="600" y="792" text-anchor="middle" fill="#9aa" font-size="11">(bypasses rerank - straight to reader)</text>

    <text x="472" y="850" text-anchor="middle">[ Gemini Reader (text + graph facts) ]</text>
    <text x="472" y="867" text-anchor="middle" fill="#ffcf6b" font-size="12">(the only Gemini call per question)</text>

    <text x="472" y="905" text-anchor="middle">Grounded Answer</text>

    <text x="472" y="958" text-anchor="middle">[ TruLens RAG Triad Evaluation ]</text>
    <text x="472" y="980" text-anchor="middle" fill="#9aa" font-size="12">(Context Relevance / Groundedness / Answer Relevance)</text>
    <text x="472" y="1000" text-anchor="middle" fill="#9aa" font-size="12">(scored locally, reusing the reranker model)</text>
  </g>
</svg>
